body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }

.header { background: linear-gradient(135deg, #1e293b, #334155); padding: 20px 32px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #334155; }

.header .subtitle { font-size: 13px; color: #94a3b8; margin-top: 2px; }

.tabs { display: flex; gap: 4px; padding: 16px 32px 0; background: #0f172a; }
.tab { padding: 8px 20px; border-radius: 8px 8px 0 0; cursor: pointer; font-size: 14px; font-weight: 500; color: #94a3b8; background: #1e293b; border: none; transition: all 0.2s; }
.tab:hover { color: #e2e8f0; background: #334155; }
.tab.active { color: #60a5fa; background: #1e293b; border-bottom: 2px solid #60a5fa; }

.main { padding: 24px 32px; }
.year-badge { display: inline-block; padding: 4px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; margin-bottom: 16px; }
.year-badge.y2024 { background: #1e3a5f; color: #60a5fa; border: 1px solid #1e3a5f; }
.year-badge.y2025 { background: #1a3a2a; color: #34d399; border: 1px solid #34d399; }

.kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
.kpi { background: #1e293b; border-radius: 12px; padding: 20px 24px; border: 1px solid #334155; }
.kpi .label { font-size: 12px; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
.kpi .value { font-size: 28px; font-weight: 700; color: #f1f5f9; }
.kpi .sub { font-size: 12px; color: #64748b; margin-top: 4px; }
.kpi .value.blue { color: #60a5fa; }
.kpi .value.green { color: #34d399; }
.kpi .value.purple { color: #a78bfa; }
.kpi .value.orange { color: #fb923c; }

.charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.chart-card { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; }
.chart-card h3 { font-size: 14px; font-weight: 600; color: #cbd5e1; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.chart-card h3::before { content: ''; display: block; width: 3px; height: 14px; background: #60a5fa; border-radius: 2px; }
.chart-card.full { grid-column: 1 / -1; }
.chart-card .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
.badge-24 { background: #1e3a5f; color: #60a5fa; }
.badge-25 { background: #1a3a2a; color: #34d399; }

.compare-section { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 24px; }
.compare-card { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; }
.compare-card h3 { font-size: 14px; font-weight: 600; color: #cbd5e1; margin-bottom: 12px; }

.section-title { font-size: 16px; font-weight: 600; color: #e2e8f0; margin: 24px 0 16px; padding-left: 12px; border-left: 3px solid #60a5fa; }
.hidden { display: none; }

.loading { text-align: center; padding: 60px; color: #64748b; font-size: 16px; }

@media (max-width: 1024px) {
  .kpi-row { grid-template-columns: repeat(2, 1fr); }
  .charts-grid { grid-template-columns: 1fr; }
  .compare-section { grid-template-columns: 1fr; }
  .header { padding: 16px 20px; }
  .main { padding: 16px 20px; }
  .tabs { padding: 12px 20px 0; }
}
</style>
</head>

<div class="header">

// Format number
function fmt(n) {
  if (n >= 1e8) return (n/1e8).toFixed(2) + '亿';
  if (n >= 1e6) return (n/1e6).toFixed(2) + '百万';
  if (n >= 1e4) return (n/1e4).toFixed(1) + '万';
  return n.toFixed(0);
}

function fmtFull(n) {
  return Number(n).toLocaleString('zh-CN', {maximumFractionDigits: 0});

// Plotly layout
const LAYOUT = {
  paper_bgcolor: 'transparent',

// ========== Chart Builders ==========

function buildMonthlyLine(year) {
  const key = 'monthly' + year;
  const d = DATA[key];
  const months = d.map(r => String(r['月']));
  const sales = d.map(r => r['销售额']);

  const trace = {
    x: months, y: sales,
    type: 'scatter',
    mode: 'lines+markers',
    name: '销售额',
    line: { color: year === 2024 ? '#60a5fa' : '#34d399', width: 3 },
    marker: { size: 8, color: year === 2024 ? '#60a5fa' : '#34d399' },
    fill: 'tozeroy',
    fillcolor: year === 2024 ? 'rgba(96,165,250,0.1)' : 'rgba(52,211,153,0.1)',
    hovertemplate: '<b>%{x}</b><br>销售额: ¥%{y:,.0f}<extra></extra>',
  };

  return Plotly.newPlot('chart-monthly', [trace], {
    ...LAYOUT,
    title: { text: '月度销售额趋势', font: { color: '#cbd5e1', size: 14 }, x: 0.5, xanchor: 'center' },
    yaxis: { ...LAYOUT.yaxis, tickformat: ',.0f', title: '销售额 (元)' },
  }, {responsive: true, displayModeBar: false});
}

function buildPlatformPie(year) {
  const key = 'plat' + year;
  const d = DATA[key];
  const colors = ['#60a5fa', '#34d399', '#a78bfa', '#fb923c', '#f472b6'];

  const trace = {
    labels: d.map(r => r['平台']),
    values: d.map(r => r['销售额']),
    type: 'pie',
    hole: 0.5,
    marker: { colors: colors },
    textinfo: 'label+percent',
    textfont: { color: '#e2e8f0', size: 12 },
    hovertemplate: '<b>%{label}</b><br>销售额: ¥%{value:,.0f}<br>占比: %{percent}<extra></extra>',
  };

  return Plotly.newPlot('chart-platform', [trace], {
    ...LAYOUT,
    title: { text: '平台分布', font: { color: '#cbd5e1', size: 14 }, x: 0.5, xanchor: 'center' },
    margin: { t: 40, r: 20, b: 20, l: 20 },
    showlegend: true,
    legend: { orientation: 'h', y: -0.2, x: 0.5, xanchor: 'center' },
  }, {responsive: true, displayModeBar: false});
}

function buildCategory(year) {
  const key = 'cat' + year;
  const obj = DATA[key];
  const cats = Object.keys(obj);
  const vals = Object.values(obj);
  const colors = ['#60a5fa', '#34d399', '#a78bfa', '#fb923c', '#f472b6', '#facc15', '#38bdf8', '#4ade80'];

  const trace = {
    x: vals, y: cats,
    type: 'bar',
    orientation: 'h',
    marker: { color: cats.map((_, i) => colors[i % colors.length]) },
    hovertemplate: '<b>%{y}</b><br>销售额: ¥%{x:,.0f}<extra></extra>',
  };

  return Plotly.newPlot('chart-category', [trace], {
    ...LAYOUT,
    title: { text: 'Lv1类目 TOP10', font: { color: '#cbd5e1', size: 14 }, x: 0.5, xanchor: 'center' },
    margin: { t: 10, r: 100, b: 40, l: 120 },
    yaxis: { gridcolor: 'transparent', linecolor: '#334155', tickfont: { color: '#94a3b8', size: 12 }, showgrid: false },
  }, {responsive: true, displayModeBar: false});
}

function buildCompare() {
  // Monthly comparison
  const m24 = DATA.monthly24.map(r => ({m: String(r['月']), v: r['销售额']}));
  const m25 = DATA.monthly25.map(r => ({m: String(r['月']), v: r['销售额']}));

  const allMonths = [...new Set([...m24.map(r=>r.m), ...m25.map(r=>r.m)])].sort();
  const v24 = allMonths.map(m => { const r = m24.find(x=>x.m===m); return r ? r.v : 0; });
  const v25 = allMonths.map(m => { const r = m25.find(x=>x.m===m); return r ? r.v : 0; });

  Plotly.newPlot('cmp-monthly', [
    { x: allMonths, y: v24, type: 'scatter', mode: 'lines+markers', name: '2024', line: {color:'#60a5fa', width:2}, marker: {size:7}, hovertemplate: '<b>%{x}</b><br>2024: ¥%{y:,.0f}<extra></extra>' },
    { x: allMonths, y: v25, type: 'scatter', mode: 'lines+markers', name: '2025', line: {color:'#34d399', width:2}, marker: {size:7}, hovertemplate: '<b>%{x}</b><br>2025: ¥%{y:,.0f}<extra></extra>' },

    ...LAYOUT,
    title: { text: '月度销售额对比 (万元)', font: {color:'#cbd5e1', size:14}, x:0.5, xanchor:'center'},
    yaxis: {...LAYOUT.yaxis, tickformat: ',.0f'},
    legend: { bgcolor:'transparent', orientation:'h', y:1.12, x:0.5, xanchor:'center', font:{color:'#94a3b8',size:12} },
  }, {responsive:true, displayModeBar:false});

  // Category comparison
  const cat24 = DATA.cat24;
  const cat25 = DATA.cat25;
  const allCats = [...new Set([...Object.keys(cat24), ...Object.keys(cat25)])].sort();
  const c24 = allCats.map(k => cat24[k] || 0);
  const c25 = allCats.map(k => cat25[k] || 0);

  Plotly.newPlot('cmp-category', [
    { x: allCats, y: c24, type: 'bar', name: '2024', marker: {color:'#60a5fa'}, hovertemplate:'<b>%{x}</b><br>2024: ¥%{y:,.0f}<extra></extra>' },
    { x: allCats, y: c25, type: 'bar', name: '2025', marker: {color:'#34d399'}, hovertemplate:'<b>%{x}</b><br>2025: ¥%{y:,.0f}<extra></extra>' },
  ], {
    ...LAYOUT,
    barmode: 'group',
    title: { text: 'Lv1类目对比', font: {color:'#cbd5e1', size:14}, x:0.5, xanchor:'center'},
    xaxis: {...LAYOUT.xaxis, tickfont: {color:'#94a3b8', size:11}},
    legend: { bgcolor:'transparent', orientation:'h', y:1.12, x:0.5, xanchor:'center', font:{color:'#94a3b8',size:12} },
  }, {responsive:true, displayModeBar:false});

  // KPI comparison
  const total24 = Object.values(DATA.cat24).reduce((a,b)=>a+b,0);
  const total25 = Object.values(DATA.cat25).reduce((a,b)=>a+b,0);
  const growth = total25 > 0 ? ((total25 - total24) / total24 * 100) : 0;

  document.getElementById('total24-label').textContent = '2024总: ¥' + fmt(total24);
  document.getElementById('total25-label').textContent = '2025总: ¥' + fmt(total25);
}

// ========== Render Year View ==========

function renderYearView(year) {
  const total = Object.values(DATA['cat' + year]).reduce((a,b)=>a+b,0);
  const sales = (DATA['sales' + year] || []).reduce((a,r)=>a+r['销量'], 0);
  const avg = total / (DATA['monthly' + year] || []).length;
  const count = Object.keys(DATA['brand' + year] || {}).length;

  document.getElementById('kpi-area').innerHTML = `
    <div class="kpi">
      <div class="label">年度总销售额</div>
      <div class="value blue">¥${fmt(total)}</div>
      <div class="sub">${fmtFull(total)} 元</div>
    </div>
    <div class="kpi">
      <div class="label">月均销售额</div>
      <div class="value green">¥${fmt(avg)}</div>
      <div class="sub">共 ${(DATA['monthly'+year]||[]).length} 个月</div>
    </div>
    <div class="kpi">
      <div class="label">年度总销量</div>
      <div class="value purple">${fmt(sales)} 件</div>
      <div class="sub">${fmtFull(sales)} 件</div>
    </div>
    <div class="kpi">
      <div class="label">品牌数量</div>
      <div class="value orange">${count}</div>
      <div class="sub">有销售记录的品牌</div>
    </div>
  `;

  document.getElementById('charts-area').innerHTML = `
    <div class="chart-card full" id="chart-monthly-wrap"><div id="chart-monthly"></div></div>
    <div class="chart-card" id="chart-platform-wrap"><div id="chart-platform"></div></div>
    <div class="chart-card" id="chart-category-wrap"><div id="chart-category"></div></div>
    <div class="chart-card full" id="chart-brand-wrap"><div id="chart-brand"></div></div>
    <div class="chart-card" id="chart-subcategory-wrap"><div id="chart-subcategory"></div></div>
    <div class="chart-card" id="chart-sales-wrap"><div id="chart-sales"></div></div>
  `;

  buildMonthlyLine(year);
  buildPlatformPie(year);
  buildCategory(year);
  buildBrand(year);
  buildSubCategory(year);
  buildSalesLine(year);
}

// ========== Tab Controllers ==========

function showYear(year) {
  currentView = year;
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.classList.toggle('active', i === (year === 2024 ? 0 : 1));
  });
  document.getElementById('main').classList.remove('hidden');
  document.getElementById('compare-view').classList.add('hidden');
  renderYearView(year);
}

function showCompare() {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab')[2].classList.add('active');
  document.getElementById('main').classList.add('hidden');
  document.getElementById('compare-view').classList.remove('hidden');

  document.getElementById('compare-area').innerHTML = `
    <div class="compare-card">
      <h3>月度销售额对比</h3>
      <div id="cmp-monthly"></div>
    </div>
    <div class="compare-card">
      <h3>Lv1类目对比</h3>
      <div id="cmp-category"></div>
    </div>
  `;
  buildCompare();
}

// Init
window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('loading').classList.add('hidden');
  showYear(2024);
  buildCompare();
});
</script>
</body>
</html>
